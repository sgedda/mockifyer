<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockifyer Browser Test</title>
</head>
<body>
  <h1>Mockifyer Browser Test</h1>
  <div id="result">Running test...</div>
  <script type="module">
    import { testMemoryProvider } from './dist/index.js';
    const result = testMemoryProvider();
    document.getElementById('result').textContent = result.success 
      ? '✅ Test passed' 
      : `❌ Test failed: ${result.error}`;
  </script>
</body>
</html>
