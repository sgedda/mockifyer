<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="WanderWeird Atlas generated automatically from a Playwright E2E run: 1205 requests, 21 observed endpoints." />
  <title>WanderWeird Atlas — Playwright E2E artifact | Mockifyer</title>
  <link rel="canonical" href="https://mockifyer.dev/atlas/wanderweird" />
  <style>
    /* Match atlas.html: light-only Mockifyer design tokens + header padding 1.5rem */
    :root {
      color-scheme: light;
      --border: 240 5.9% 90%;
      --primary: 221.2 83.2% 53.3%;
      --muted-foreground: 240 3.8% 46.1%;
      --foreground: 240 10% 3.9%;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
      color: hsl(var(--foreground));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }
    .banner {
      /* Same horizontal inset as atlas.html header/main (1.5rem) — full-width, not centered column */
      padding: 0.55rem 1.5rem;
      border-bottom: 1px solid hsl(var(--border));
      background: hsl(210 40% 98%);
    }
    .banner-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 1.25rem;
      width: 100%;
      max-width: 100%;
    }
    .banner-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      min-width: 0;
      flex: 1 1 auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 650;
      line-height: 1.2;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid hsl(221.2 83.2% 53.3% / 0.25);
      background: hsl(221.2 83.2% 53.3% / 0.08);
      color: hsl(221.2 83.2% 40%);
      white-space: nowrap;
    }
    .stats {
      font-size: 0.8125rem;
      line-height: 1.35;
      color: hsl(var(--muted-foreground));
    }
    .stats .sep { margin: 0 0.35rem; opacity: 0.55; }
    .banner-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      flex: 0 0 auto;
    }
    .banner a {
      font-size: 0.8125rem;
      line-height: 1.2;
      text-decoration: none;
    }
    .banner a.primary {
      color: hsl(var(--primary));
      font-weight: 650;
    }
    .banner a.primary:hover { text-decoration: underline; }
    .banner a.home {
      color: hsl(var(--muted-foreground));
      font-weight: 500;
    }
    .banner a.home:hover {
      color: hsl(var(--foreground));
      text-decoration: underline;
    }
    .frame-wrap {
      height: calc(100% - 2.75rem);
      min-height: 480px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
      display: block;
    }
    @media (max-width: 720px) {
      .banner { padding: 0.55rem 1rem; }
      .banner-inner { align-items: flex-start; }
      .frame-wrap { height: calc(100% - 4.25rem); }
    }
  </style>
</head>
<body>
  <header class="banner" id="atlas-origin-banner">
    <div class="banner-inner">
      <div class="banner-left">
        <span class="badge">Generated by a Playwright E2E run</span>
        <span class="stats" aria-label="Atlas generation stats">
          1205 requests<span class="sep">·</span>21 endpoints<span class="sep">·</span>2026-11-23
        </span>
      </div>
      <div class="banner-right">
        <a class="primary" href="/guides/atlas-from-playwright">How it's generated →</a>
        <a class="home" href="/">← Mockifyer home</a>
      </div>
    </div>
  </header>
  <div class="frame-wrap">
    <iframe
      title="Interactive WanderWeird Atlas"
      src="./atlas.html"
      loading="eager"
    ></iframe>
  </div>
</body>
</html>
