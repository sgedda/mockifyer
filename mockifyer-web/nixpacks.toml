# Prefer Node 20 (matches package.json engines / .nvmrc). Avoid nodejs_24 from auto-detect.
[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
# Install exact Node.js version 20.19.5 directly BEFORE Nixpacks installs its version
# Must happen early to override Nixpacks' auto-detected Node.js
cmds = [
  "curl -fsSL https://nodejs.org/dist/v20.19.5/node-v20.19.5-linux-x64.tar.xz -o /tmp/node.tar.xz || true",
  "tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1 2>/dev/null || true",
  "rm -f /tmp/node.tar.xz",
  "export PATH=/usr/local/bin:$PATH",
  "node --version || echo 'Node not yet installed'",
  "rm -f package-lock.json package-lock.prod.json 2>/dev/null || true"
]

[phases.install]
cmds = [
  "export PATH=/usr/local/bin:$PATH",
  "node --version",
  "rm -f package-lock.json package-lock.prod.json 2>/dev/null || true",
  "cp package.prod.json package.json 2>/dev/null || true",
  # Do not use npm@latest — npm 12+ requires Node ^22.22.2 || ^24.15.0 || >=26 and breaks on older 24.x
  "npm --version",
  "echo '@sgedda:registry=https://registry.npmjs.org/' > .npmrc",
  "echo 'legacy-peer-deps=true' >> .npmrc",
  # --include=dev so typescript (build:backend) is installed under NODE_ENV=production
  "npm install --legacy-peer-deps --no-audit --no-fund --include=dev"
]

[phases.build]
cmds = [
  "export PATH=/usr/local/bin:$PATH",
  "node --version",
  "npm --version",
  # Prefer CI-prebuilt SPA (spa-railway-upload.tar.gz) — vite OOM-kills on some Metal builders.
  # Name is intentionally NOT gitignored so `railway up` includes it without --no-gitignore.
  "bash -lc 'set -euo pipefail; echo \"📦 Starting build process...\"; mkdir -p public; if [ -f spa-railway-upload.tar.gz ]; then echo \"✅ Extracting prebuilt frontend from spa-railway-upload.tar.gz\"; tar -xzf spa-railway-upload.tar.gz -C public; elif [ -f frontend-public.tar.gz ]; then echo \"✅ Extracting prebuilt frontend from frontend-public.tar.gz\"; tar -xzf frontend-public.tar.gz -C public; elif [ -f public/index.html ] && [ -d public/assets ]; then echo \"✅ Using prebuilt frontend already in public/\"; else echo \"📦 No prebuilt frontend — building on Railway (may OOM on Metal)\"; cd frontend && npm install --legacy-peer-deps --no-audit --no-fund --include=dev && npm run build && cd ..; fi; echo \"🔨 Building backend...\"; npm run build:backend; test -f public/index.html; test -d public/assets; ls -la public/assets | head -20; echo \"✅ Build verified\"; mkdir -p mock-data; echo \"{\\\"deployedDate\\\":\\\"$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)\\\",\\\"buildHash\\\":\\\"$(echo $RANDOM | md5sum | cut -d\\\" \\\" -f1)\\\"}\" > public/build-info.json; cat public/build-info.json'"
]

[start]
# Run node directly so SIGTERM from the platform isn’t reported as an npm failure during shutdown
cmd = "export PATH=/usr/local/bin:$PATH && node dist/index.js"
