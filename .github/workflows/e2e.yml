name: E2E (WanderWeird + Mockifyer)

on:
  workflow_dispatch:
    inputs:
      record_video:
        description: 'Record video for all tests (not just failures)'
        type: boolean
        default: false
      presentation:
        description: 'Presentation mode: GUI tests hold ~2.5 s at each value change (slow, readable recordings)'
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily
  pull_request:
    paths:
      - 'packages/mockifyer-dashboard/**'
      - 'packages/mockifyer-core/**'
      - 'packages/mockifyer-fetch/**'
      - 'packages/mockifyer-axios/**'
      - 'packages/mockifyer-mcp/**'
      - 'packages/mockifyer-test-helper/**'
      - 'example-projects/wanderweird-travel/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      WW: example-projects/wanderweird-travel
      NODE_ENV: development
      E2E_VIDEO: ${{ (github.event_name == 'schedule' || inputs.record_video) && 'on' || 'off' }}
      # On for the nightly schedule and for manual runs (unless unticked); off for pull requests.
      E2E_PRESENTATION: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.presentation)) && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            example-projects/wanderweird-travel/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build Mockifyer packages
        run: |
          cd packages/mockifyer-core && npm ci && npm run build
          cd ../mockifyer-axios && npm ci && npm run build
          cd ../mockifyer-fetch && npm ci && npm run build
          cd ../mockifyer-dashboard && npm ci && npm run build:backend
          (cd frontend && npm ci && npm run build)
          cd ../mockifyer-mcp && npm ci && npm run build

      - name: Verify dashboard build
        run: |
          ls -lh packages/mockifyer-dashboard/dist/
          file packages/mockifyer-dashboard/dist/cli.js || echo "cli.js not found"
          grep -q 'id="root"' packages/mockifyer-dashboard/public/index.html

      - name: Install WanderWeird
        working-directory: ${{ env.WW }}
        run: |
          npm ci --legacy-peer-deps
          cd apps/mobile && npm ci --legacy-peer-deps

      - name: Start dashboard (sqlite) in background
        working-directory: ${{ env.WW }}
        run: |
          nohup npx mockifyer-dashboard --provider sqlite --path ./mock-data --port 3002 --host 127.0.0.1 > /tmp/dashboard.log 2>&1 &
          DASH_PID=$!
          echo "Dashboard PID: $DASH_PID"
          echo $DASH_PID > /tmp/dashboard.pid
          sleep 2
          if ! ps -p $DASH_PID > /dev/null; then
            echo "Dashboard failed to start!"
            cat /tmp/dashboard.log
            exit 1
          fi

      - name: Wait for dashboard
        run: |
          echo "Waiting for dashboard..."
          npx wait-on -t 120000 -i 2000 http-get://127.0.0.1:3002/api/scenario-config
          echo "Dashboard is ready"

      # Second instance of the branch build for main-features.spec (MAIN_DASHBOARD_URL): own port and
      # data dir, so it never touches the :3002 demo stack. The spec seeds it via scenario import.
      - name: Start main dashboard (branch build, :3012)
        run: |
          mkdir -p /tmp/mockifyer-main-data
          nohup node packages/mockifyer-dashboard/bin/mockifyer-dashboard --provider sqlite --path /tmp/mockifyer-main-data --port 3012 --host 127.0.0.1 > /tmp/main-dashboard.log 2>&1 &
          npx wait-on -t 60000 -i 1000 http-get://127.0.0.1:3012/api/scenario-config

      - name: Start WanderWeird services unpinned (follow lane)
        working-directory: ${{ env.WW }}
        run: |
          nohup npm run dev:proxy:record > /tmp/services.log 2>&1 &
          echo "Services PID: $!"

      - name: Wait for services
        run: |
          npx wait-on -t 120000 tcp:127.0.0.1:4200 tcp:127.0.0.1:4203
          sleep 3

      - name: Start Expo web (Metro)
        working-directory: ${{ env.WW }}/apps/mobile
        run: |
          EXPO_PUBLIC_MOCKIFYER_CLIENT_ID=wanderweird-demo nohup npx expo start --web --port 8090 > /tmp/metro.log 2>&1 &
          echo "Metro PID: $!"

      - name: Wait for Expo web
        run: npx wait-on -t 180000 http-get://127.0.0.1:8090

      - name: Get Playwright version
        id: playwright-version
        working-directory: e2e
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $PLAYWRIGHT_VERSION"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser binaries
        working-directory: e2e
        run: npx playwright install chromium

      - name: Install Playwright system dependencies with retry
        working-directory: e2e
        timeout-minutes: 20
        run: |
          set -e
          MAX_ATTEMPTS=3
          BACKOFF=5
          INSTALL_TIMEOUT=240  # 4 minutes per attempt

          # Configure apt: lower timeouts and retries
          sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null <<EOF
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF

          install_deps() {
            echo "Attempt $1/$MAX_ATTEMPTS: Installing Playwright system dependencies (${INSTALL_TIMEOUT}s timeout)..."
            if sudo timeout --kill-after=10s ${INSTALL_TIMEOUT}s npx playwright install-deps chromium; then
              echo "✓ Successfully installed Playwright system dependencies"
              return 0
            else
              local exit_code=$?
              if [ $exit_code -eq 124 ]; then
                echo "✗ Timed out after ${INSTALL_TIMEOUT}s"
              else
                echo "✗ Failed with exit code $exit_code"
              fi
              return 1
            fi
          }

          # Try with default Ubuntu mirrors (azure.archive.ubuntu.com)
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if install_deps $i; then
              exit 0
            fi
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "⚠ Failed, waiting ${BACKOFF}s before retry..."
              sleep $BACKOFF
              BACKOFF=$((BACKOFF * 2))
            fi
          done

          # If all attempts fail, switch to main Ubuntu mirrors
          echo ""
          echo "⚠ All attempts failed with azure.archive.ubuntu.com"
          echo "→ Switching to archive.ubuntu.com and security.ubuntu.com..."
          
          # Ubuntu 24.04 uses DEB822 format in sources.list.d/ubuntu.sources
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          # Also update the mirror file used by GitHub-hosted runners
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get clean
          
          echo "→ Running apt-get update to refresh package lists..."
          if sudo timeout --kill-after=10s 120s apt-get update -qq; then
            echo "✓ apt-get update succeeded"
          else
            echo "⚠ apt-get update failed or timed out, proceeding with cached lists"
          fi

          # Final attempt with fallback mirrors
          echo ""
          echo "Final attempt with fallback mirrors (${INSTALL_TIMEOUT}s timeout)..."
          if sudo timeout --kill-after=10s ${INSTALL_TIMEOUT}s npx playwright install-deps chromium; then
            echo "✓ Successfully installed with fallback mirrors"
            exit 0
          else
            echo "✗ Failed to install Playwright system dependencies"
            echo ""
            echo "Diagnostic info:"
            echo "Active apt sources:"
            grep -v '^#' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | grep -E '^(Types|URIs|Suites)' || echo "  (none found)"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "Mirror list:"
              cat /etc/apt/apt-mirrors.txt | head -5
            fi
            exit 1
          fi

      # The `gui` project always records (app + dashboard) and traces; the `chromium` project
      # records only on failure unless E2E_VIDEO is on (schedule / manual checkbox).
      - name: Run E2E tests
        working-directory: e2e
        env:
          MAIN_DASHBOARD_URL: http://127.0.0.1:3012
          MAIN_MCP_CLI: ${{ github.workspace }}/packages/mockifyer-mcp/dist/cli.js
        run: npx playwright test

      # Side-by-side clips plus a Markdown description per test and the run summary (also the job summary).
      # GITHUB_TOKEN reads this job's step list for the docs; without it they list the steps from this file.
      - name: Compose side-by-side GUI videos and run docs
        if: ${{ !cancelled() && hashFiles('e2e/test-results/results.json') != '' }}
        working-directory: e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run artifacts

      - name: Upload side-by-side GUI videos and run docs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gui-videos
          path: |
            e2e/gui-videos/*.mp4
            e2e/gui-videos/*.md
            e2e/gui-videos/other-tests/*.md
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Upload individual videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos
          path: |
            e2e/gui-videos/individual/*.webm
            e2e/test-results/**/*.webm
            !e2e/test-results/dashboard-gui-*/**
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results/**/trace.zip
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Upload test results and service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e/test-results
            /tmp/dashboard.log
            /tmp/main-dashboard.log
            /tmp/services.log
            /tmp/metro.log
            /tmp/wander-api.log
            /tmp/gateway-api.log
            /tmp/scratch-dashboard.log
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Debug logs on failure
        if: failure()
        run: |
          echo "=== Dashboard log ==="
          tail -100 /tmp/dashboard.log || echo "No dashboard log"
          echo "=== Main dashboard (:3012) log ==="
          tail -50 /tmp/main-dashboard.log || echo "No main dashboard log"
          echo "=== Services log ==="
          tail -100 /tmp/services.log || echo "No services log"
          echo "=== Metro log ==="
          tail -100 /tmp/metro.log || echo "No metro log"
