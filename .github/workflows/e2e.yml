name: E2E (WanderWeird + Mockifyer)

on:
  workflow_dispatch:
    inputs:
      record_video:
        description: 'Record video for all tests (not just failures)'
        type: boolean
        default: false
      presentation:
        description: 'Presentation mode: GUI tests hold ~2.5 s at each value change (slow, readable recordings)'
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily
  pull_request:
    paths:
      - 'packages/mockifyer-dashboard/**'
      - 'packages/mockifyer-core/**'
      - 'packages/mockifyer-fetch/**'
      - 'packages/mockifyer-axios/**'
      - 'packages/mockifyer-mcp/**'
      - 'packages/mockifyer-test-helper/**'
      - 'example-projects/wanderweird-travel/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      WW: example-projects/wanderweird-travel
      NODE_ENV: development
      E2E_VIDEO: ${{ (github.event_name == 'schedule' || inputs.record_video) && 'on' || 'off' }}
      # On for the nightly schedule and for manual runs (unless unticked); off for pull requests.
      E2E_PRESENTATION: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.presentation)) && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            example-projects/wanderweird-travel/package-lock.json
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      - name: Build Mockifyer packages
        run: |
          cd packages/mockifyer-core && npm ci && npm run build
          cd ../mockifyer-axios && npm ci && npm run build
          cd ../mockifyer-fetch && npm ci && npm run build
          cd ../mockifyer-dashboard && npm ci && npm run build:backend
          (cd frontend && npm ci && npm run build)
          cd ../mockifyer-mcp && npm ci && npm run build

      - name: Verify dashboard build
        run: |
          ls -lh packages/mockifyer-dashboard/dist/
          file packages/mockifyer-dashboard/dist/cli.js || echo "cli.js not found"
          grep -q 'id="root"' packages/mockifyer-dashboard/public/index.html

      - name: Install WanderWeird
        working-directory: ${{ env.WW }}
        run: |
          npm ci --legacy-peer-deps
          cd apps/mobile && npm ci --legacy-peer-deps

      - name: Start dashboard (sqlite) in background
        working-directory: ${{ env.WW }}
        run: |
          nohup env MOCKIFYER_DEBUG_PROXY_TIMING=1 npx mockifyer-dashboard --provider sqlite --path ./mock-data --port 3002 --host 127.0.0.1 > /tmp/dashboard.log 2>&1 &
          DASH_PID=$!
          echo "Dashboard PID: $DASH_PID"
          echo $DASH_PID > /tmp/dashboard.pid
          sleep 2
          if ! ps -p $DASH_PID > /dev/null; then
            echo "Dashboard failed to start!"
            cat /tmp/dashboard.log
            exit 1
          fi

      - name: Wait for dashboard
        run: |
          echo "Waiting for dashboard..."
          npx wait-on -t 120000 -i 2000 http-get://127.0.0.1:3002/api/scenario-config
          echo "Dashboard is ready"

      # Second instance of the branch build for main-features.spec (MAIN_DASHBOARD_URL): own port and
      # data dir, so it never touches the :3002 demo stack. The spec seeds it via scenario import.
      - name: Start main dashboard (branch build, :3012)
        run: |
          mkdir -p /tmp/mockifyer-main-data
          nohup env MOCKIFYER_DEBUG_PROXY_TIMING=1 node packages/mockifyer-dashboard/bin/mockifyer-dashboard --provider sqlite --path /tmp/mockifyer-main-data --port 3012 --host 127.0.0.1 > /tmp/main-dashboard.log 2>&1 &
          npx wait-on -t 60000 -i 1000 http-get://127.0.0.1:3012/api/scenario-config

      - name: Start WanderWeird services unpinned (follow lane)
        working-directory: ${{ env.WW }}
        run: |
          nohup env MOCKIFYER_DEBUG_PROXY_TIMING=1 npm run dev:proxy:record > /tmp/services.log 2>&1 &
          echo "Services PID: $!"

      - name: Wait for services
        run: |
          npx wait-on -t 120000 tcp:127.0.0.1:4200 tcp:127.0.0.1:4203
          sleep 3

      - name: Start Expo web (Metro)
        working-directory: ${{ env.WW }}/apps/mobile
        run: |
          EXPO_PUBLIC_MOCKIFYER_CLIENT_ID=wanderweird-demo nohup npx expo start --web --port 8090 > /tmp/metro.log 2>&1 &
          echo "Metro PID: $!"

      - name: Wait for Expo web
        run: npx wait-on -t 180000 http-get://127.0.0.1:8090

      - name: Get Playwright version
        id: playwright-version
        working-directory: e2e
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $PLAYWRIGHT_VERSION"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser binaries
        working-directory: e2e
        run: npx playwright install chromium

      - name: Install Playwright system dependencies with retry
        working-directory: e2e
        timeout-minutes: 20
        run: |
          set -e
          MAX_ATTEMPTS=3
          BACKOFF=5
          INSTALL_TIMEOUT=240  # 4 minutes per attempt

          # Configure apt: lower timeouts and retries
          sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null <<EOF
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF

          install_deps() {
            echo "Attempt $1/$MAX_ATTEMPTS: Installing Playwright system dependencies (${INSTALL_TIMEOUT}s timeout)..."
            if sudo timeout --kill-after=10s ${INSTALL_TIMEOUT}s npx playwright install-deps chromium; then
              echo "✓ Successfully installed Playwright system dependencies"
              return 0
            else
              local exit_code=$?
              if [ $exit_code -eq 124 ]; then
                echo "✗ Timed out after ${INSTALL_TIMEOUT}s"
              else
                echo "✗ Failed with exit code $exit_code"
              fi
              return 1
            fi
          }

          # Try with default Ubuntu mirrors (azure.archive.ubuntu.com)
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if install_deps $i; then
              exit 0
            fi
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "⚠ Failed, waiting ${BACKOFF}s before retry..."
              sleep $BACKOFF
              BACKOFF=$((BACKOFF * 2))
            fi
          done

          # If all attempts fail, switch to main Ubuntu mirrors
          echo ""
          echo "⚠ All attempts failed with azure.archive.ubuntu.com"
          echo "→ Switching to archive.ubuntu.com and security.ubuntu.com..."
          
          # Ubuntu 24.04 uses DEB822 format in sources.list.d/ubuntu.sources
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          # Also update the mirror file used by GitHub-hosted runners
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get clean
          
          echo "→ Running apt-get update to refresh package lists..."
          if sudo timeout --kill-after=10s 120s apt-get update -qq; then
            echo "✓ apt-get update succeeded"
          else
            echo "⚠ apt-get update failed or timed out, proceeding with cached lists"
          fi

          # Final attempt with fallback mirrors
          echo ""
          echo "Final attempt with fallback mirrors (${INSTALL_TIMEOUT}s timeout)..."
          if sudo timeout --kill-after=10s ${INSTALL_TIMEOUT}s npx playwright install-deps chromium; then
            echo "✓ Successfully installed with fallback mirrors"
            exit 0
          else
            echo "✗ Failed to install Playwright system dependencies"
            echo ""
            echo "Diagnostic info:"
            echo "Active apt sources:"
            grep -v '^#' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | grep -E '^(Types|URIs|Suites)' || echo "  (none found)"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "Mirror list:"
              cat /etc/apt/apt-mirrors.txt | head -5
            fi
            exit 1
          fi

      # The `gui` project always records (app + dashboard) and traces; the `chromium` project
      # records only on failure unless E2E_VIDEO is on (schedule / manual checkbox).
      - name: Run E2E tests
        working-directory: e2e
        env:
          MAIN_DASHBOARD_URL: http://127.0.0.1:3012
          MAIN_MCP_CLI: ${{ github.workspace }}/packages/mockifyer-mcp/dist/cli.js
          MOCKIFYER_DEBUG_PROXY_TIMING: '1'
        run: npx playwright test

      # Side-by-side clips plus a Markdown description per test and the run summary (also the job summary).
      # GITHUB_TOKEN reads this job's step list for the docs; without it they list the steps from this file.
      - name: Compose side-by-side GUI videos and run docs
        if: ${{ !cancelled() && hashFiles('e2e/test-results/results.json') != '' }}
        working-directory: e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run artifacts

      - name: Upload side-by-side GUI videos and run docs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-gui-videos
          path: |
            e2e/gui-videos/*.mp4
            e2e/gui-videos/*.md
            e2e/gui-videos/other-tests/*.md
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload individual videos (failure only)
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-videos
          path: |
            e2e/gui-videos/individual/*.webm
            e2e/test-results/**/*.webm
            !e2e/test-results/dashboard-gui-*/**
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload Playwright HTML report (failure only)
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload traces (failure only)
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload Atlas architecture documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-architecture
          path: e2e/atlas-report/
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Upload test results and service logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            e2e/test-results
            /tmp/dashboard.log
            /tmp/main-dashboard.log
            /tmp/services.log
            /tmp/metro.log
            /tmp/wander-api.log
            /tmp/gateway-api.log
            /tmp/scratch-dashboard.log
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Debug logs on failure
        if: failure()
        run: |
          echo "=== Dashboard log ==="
          tail -100 /tmp/dashboard.log || echo "No dashboard log"
          echo "=== Main dashboard (:3012) log ==="
          tail -50 /tmp/main-dashboard.log || echo "No main dashboard log"
          echo "=== Services log ==="
          tail -100 /tmp/services.log || echo "No services log"
          echo "=== Metro log ==="
          tail -100 /tmp/metro.log || echo "No metro log"

  # Publish Atlas documentation to GitHub Pages at /atlas/
  # Also merges with Drift report if available
  # Only on main branch (scheduled runs or pushes, not PRs or manual dispatch)
  deploy-pages:
    needs: e2e
    # Deploy only on main branch, for schedule runs (nightly) or workflow_dispatch
    # Note: workflow does not trigger on push events; if push deployment is needed, add 'push' to workflow triggers
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download Atlas artifact
        id: download_atlas
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: atlas-architecture
          path: atlas-report

      - name: Download latest Drift artifact
        id: download_drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the most recent successful drift run on main that has drift-report artifact
          echo "Searching for latest Drift artifact..."
          RUN_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/drift.yml/runs?branch=main&status=success&per_page=10" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | head -1)
          
          if [ -z "$RUN_ID" ]; then
            echo "No successful drift run found with drift-report artifact"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found drift run: $RUN_ID"
          
          # Download the drift-report artifact from that run
          mkdir -p drift-report
          gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "drift-report") | .id' | head -1 | \
            xargs -I {} gh api "/repos/${{ github.repository }}/actions/artifacts/{}/zip" > drift.zip || {
              echo "Failed to download Drift artifact"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            }
          
          unzip -q drift.zip -d drift-report
          rm drift.zip
          
          if [ ! -d "drift-report" ] || [ -z "$(ls -A drift-report 2>/dev/null)" ]; then
            echo "Drift artifact is empty"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✓ Downloaded Drift artifact from run $RUN_ID"
          fi

      - name: Check artifacts exist
        id: check_artifacts
        run: |
          has_atlas=false
          has_drift=false
          
          if [ -d "atlas-report" ] && [ -n "$(ls -A atlas-report 2>/dev/null)" ]; then
            echo "✓ Atlas report found: $(du -sh atlas-report | cut -f1)"
            has_atlas=true
          fi
          
          if [ "${{ steps.download_drift.outputs.skip }}" != "true" ] && [ -d "drift-report" ] && [ -n "$(ls -A drift-report 2>/dev/null)" ]; then
            echo "✓ Drift report found: $(du -sh drift-report | cut -f1)"
            has_drift=true
          fi
          
          if [ "$has_atlas" = false ] && [ "$has_drift" = false ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ No artifacts to deploy"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare Pages directory structure
        if: steps.check_artifacts.outputs.skip != 'true'
        run: |
          mkdir -p pages-root
          
          # Copy Atlas report to /atlas/
          if [ -d "atlas-report" ] && [ -n "$(ls -A atlas-report 2>/dev/null)" ]; then
            mkdir -p pages-root/atlas
            cp -r atlas-report/* pages-root/atlas/
            echo "✓ Atlas report copied to /atlas/"
          fi
          
          # Copy Drift report to /drift/
          if [ -d "drift-report" ] && [ -n "$(ls -A drift-report 2>/dev/null)" ]; then
            mkdir -p pages-root/drift
            cp -r drift-report/* pages-root/drift/
            echo "✓ Drift report copied to /drift/"
          fi
          
          # Create root index.html with links to both (or redirect to Atlas if drift unavailable)
          # Check which reports are available
          HAS_ATLAS=""
          if [ -d "pages-root/atlas" ] && [ -n "$(ls -A pages-root/atlas 2>/dev/null)" ]; then
            HAS_ATLAS="yes"
          fi
          
          if [ -d "drift-report" ] && [ -n "$(ls -A drift-report 2>/dev/null)" ]; then
            # Drift available: show landing page with conditional Atlas link
            cat > pages-root/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mockifyer Documentation</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
              }
              .container {
                background: white;
                border-radius: 1rem;
                padding: 3rem;
                max-width: 600px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
              }
              h1 {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
                color: #667eea;
              }
              .subtitle {
                color: #666;
                margin-bottom: 2rem;
              }
              .links {
                display: flex;
                flex-direction: column;
                gap: 1rem;
              }
              a {
                display: block;
                padding: 1.5rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                text-decoration: none;
                border-radius: 0.5rem;
                font-size: 1.25rem;
                font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s;
              }
              a:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
              }
              .description {
                font-size: 0.875rem;
                opacity: 0.9;
                margin-top: 0.5rem;
              }
              .footer {
                margin-top: 2rem;
                text-align: center;
                color: #999;
                font-size: 0.875rem;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📚 Mockifyer</h1>
              <p class="subtitle">API mock record/replay with drift detection</p>
              
              <div class="links">$([ -n "$HAS_ATLAS" ] && echo '
                <a href="atlas/">
                  🗺️ Atlas Architecture
                  <div class="description">Auto-generated API architecture documentation</div>
                </a>')
                <a href="drift/">
                  🎭 Drift Check Showcase
                  <div class="description">Live drift detection against simulated & real APIs</div>
                </a>
              </div>
              
              <div class="footer">
                <p>Generated from nightly CI runs</p>
                <p><a href="https://github.com/sgedda/mockifyer" style="all: unset; color: #667eea; cursor: pointer;">View on GitHub</a></p>
              </div>
            </div>
          </body>
          </html>
          EOF
          else
            # Atlas only: redirect to /atlas/
            cat > pages-root/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=atlas/">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Redirecting to Atlas Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="atlas/">Atlas Documentation</a>...</p>
          </body>
          </html>
          EOF
          fi
          
          echo "Pages directory structure:"
          ls -la pages-root/
          [ -d pages-root/atlas ] && echo "  /atlas/:" && ls -la pages-root/atlas/ | head -5
          [ -d pages-root/drift ] && echo "  /drift/:" && ls -la pages-root/drift/ | head -5

      - name: Upload Pages artifact
        if: steps.check_artifacts.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root
          retention-days: 1

      - name: Deploy to GitHub Pages
        if: steps.check_artifacts.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Pages link to job summary
        if: steps.check_artifacts.outputs.skip != 'true' && steps.deployment.outcome == 'success'
        run: |
          echo "## 📚 Documentation Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🗺️ [Atlas Architecture](${{ steps.deployment.outputs.page_url }}atlas/)" >> $GITHUB_STEP_SUMMARY
          if [ -d "drift-report" ] && [ -n "$(ls -A drift-report 2>/dev/null)" ]; then
            echo "- 🎭 [Drift Check Showcase](${{ steps.deployment.outputs.page_url }}drift/)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Updated from \`main\` branch_" >> $GITHUB_STEP_SUMMARY
