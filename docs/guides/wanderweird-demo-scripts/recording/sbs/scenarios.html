<!doctype html><html><head><title>WanderWeird scenarios</title><style>
html,body{margin:0;height:100%;background:#0b0f14;font-family:sans-serif;color:#cfd8e3}

.phone{width:390px;flex:none;border:2px solid #2a3340;border-radius:28px;overflow:hidden}
.right{flex:1;display:flex;flex-direction:column;gap:6px}

#sub{font-family:monospace;font-size:16px;color:#9fb3c8;padding:0 4px;min-height:20px}
.dash{flex:1;border:1px solid #2a3340;border-radius:8px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
</style></head><body><div class="wrap">
<div class="phone"><iframe id="app" src="http://localhost:8090"></iframe></div>
<div class="right"><div id="cap">Scenarios: same app, different data</div><div id="sub"></div>
<div class="dash"><iframe id="d" src="http://127.0.0.1:3002/settings"></iframe></div></div>
</div></body></html>
