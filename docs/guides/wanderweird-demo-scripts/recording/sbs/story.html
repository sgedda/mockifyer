<!doctype html><html><head><title>WanderWeird bug → fix with Mockifyer</title><style>
html,body{margin:0;height:100%;background:#0b0f14;font-family:sans-serif;color:#cfd8e3}
.wrap{display:flex;height:100%;gap:8px;padding:8px;box-sizing:border-box}
.phone{width:390px;flex:none;border:2px solid #2a3340;border-radius:28px;overflow:hidden}
.right{flex:1;display:flex;flex-direction:column;gap:6px}
.steps{display:flex;gap:6px}
.steps button{background:#1a2230;color:#cfd8e3;border:1px solid #2a3340;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}
.steps button.on{background:#2f6fed;color:#fff}
.dash{flex:1;border:1px solid #2a3340;border-radius:8px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
</style></head><body><div class="wrap">
<div class="phone"><iframe src="http://localhost:8090"></iframe></div>
<div class="right"><div class="steps">
<button data-u="http://127.0.0.1:3002/network?scenario=guide-demo-2&clientId=wanderweird-demo" class="on">1 · Network trace</button>
<button data-u="http://localhost:8090/mockifyer-atlas-live">2 · Atlas</button>
<button data-u="http://127.0.0.1:3002/overrides?scenario=guide-demo-2">3 · Field overrides</button>
<button data-u="http://127.0.0.1:3002/mocks?scenario=guide-demo-2">4 · Fix the mock</button>
</div><div class="dash"><iframe id="d" src="http://127.0.0.1:3002/network?scenario=guide-demo-2&clientId=wanderweird-demo"></iframe></div></div>
</div><script>
document.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{document.getElementById('d').src=b.dataset.u;document.querySelectorAll('.steps button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
